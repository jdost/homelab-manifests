apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared

spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared

  template:
    metadata:
      labels:
        app: cloudflared

    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
          - tunnel
          - run
          env:
          - name: TUNNEL_METRICS
            value: 0.0.0.0:60123
          - name: TUNNEL_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflared
                key: token

          livenessProbe:
            httpGet:
              path: /ready
              port: 60123
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
