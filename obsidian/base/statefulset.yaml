apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: couchdb
  labels:
    app.kubernetes.io/name: couchdb

spec:
  replicas: 1
  selector:
    matchLabels:
      app: couchdb

  template:
    metadata:
      labels:
        app: couchdb
        app.kubernetes.io/name: couchdb
    spec:
      initContainers:
      - name: config-copy
        image: busybox:latest
        command: ["sh", "-c", "cp /tmp/config.ini /default.d/config.ini"]
        volumeMounts:
        - name: config
          mountPath: /tmp/config.ini
          subPath: config.ini
          readOnly: true
        - name: writable-config
          mountPath: /default.d
      containers:
      - name: couchdb
        image: couchdb:latest
        ports:
        - containerPort: 5984
          name: couchdb
        livenessProbe:
          exec:
            command: ["sh", "-c", "curl -G --silent --fail -u ${COUCHDB_USER}:${COUCHDB_PASSWORD} http://localhost:5984/_up"]
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["sh", "-c", "curl -G --silent --fail -u ${COUCHDB_USER}:${COUCHDB_PASSWORD} http://localhost:5984/_up"]
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: COUCHDB_USER
          valueFrom:
            secretKeyRef:
              name: couchdb-credentials
              key: username
        - name: COUCHDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: couchdb-credentials
              key: password
        volumeMounts:
        - name: data
          mountPath: /opt/couchdb/data
        - name: writable-config
          mountPath: /opt/couchdb/etc/default.d
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
      volumes:
      - name: config
        configMap:
          name: couchdb
      - name: writable-config
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data

    spec:
     accessModes:
     - ReadWriteOnce
     resources:
       requests:
         storage: 15Gi
