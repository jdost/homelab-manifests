apiVersion: "jdost.us/v1alpha1"
kind: SecretRequest
metadata:
  name: immich-frame-config

spec:
  secrets:
  - name: ImmichServerUrl
    note: Path to the immich server (in cluster, so likely `immich.svc`)
  - name: ApiKey
    note: API Key for Immich, generate under `Account` > `Settings` > `API Keys`
  - name: Albums
    note: Comma seperated list of UUIDs for albums (see Immich URL when viewing album)
